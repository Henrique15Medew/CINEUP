<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEUP - Catálogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #a78bfa;
            --dark: #0f0f23;
            --darker: #0a0a1a;
            --dark-gray: #1a1a2e;
            --medium-gray: #2d2b55;
            --light-gray: #6d6b8c;
            --light: #ffffff;
            --accent: #00f5d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header Premium */
        header {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--light);
        }

        .user-welcome {
            font-size: 16px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #dc2626, var(--danger));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        /* Mensagens */
        .alert {
            padding: 15px;
            margin: 20px 40px;
            border-radius: 12px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        /* Main Content */
        main {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: var(--primary);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-select {
            background: rgba(26, 26, 46, 0.8);
            color: var(--light);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            min-width: 150px;
            backdrop-filter: blur(10px);
        }

        .search-box {
            flex-grow: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 8px;
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--light);
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-light);
        }

        /* Grid de Filmes - Design Premium */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: linear-gradient(145deg, rgba(42, 43, 85, 0.6), rgba(26, 26, 46, 0.8));
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(139, 92, 246, 0.2);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border-color: var(--primary-light);
        }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .card-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 18px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--light);
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .card-genre {
            color: var(--primary-light);
            font-weight: 600;
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--warning);
            font-weight: 600;
        }

        .card-description {
            font-size: 14px;
            color: var(--light-gray);
            margin-bottom: 15px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .watch-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .watch-btn:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .details-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .details-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Sistema de Avaliação */
        .rating-section {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .rating-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--light);
        }

        .stars {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .star {
            font-size: 20px;
            color: var(--light-gray);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .star:hover {
            transform: scale(1.2);
            color: var(--warning);
        }

        .star.active {
            color: var(--warning);
        }

        .comment-box {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--light);
            font-size: 13px;
            resize: vertical;
            margin-bottom: 10px;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        .comment-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        /* Avaliações salvas */
        .saved-review {
            background: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-stars {
            color: var(--warning);
            font-weight: 600;
        }

        .review-date {
            color: var(--light-gray);
            font-size: 11px;
        }

        .review-comment {
            color: var(--light);
            font-size: 13px;
            line-height: 1.4;
        }

        /* Modal de Detalhes */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(145deg, rgba(42, 43, 85, 0.95), rgba(26, 26, 46, 0.98));
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.3);
            backdrop-filter: blur(40px);
        }

        .modal-header {
            padding: 20px 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--light);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--light-gray);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--light);
        }

        .modal-body {
            padding: 20px 25px;
        }

        .movie-details {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .movie-poster {
            flex: 0 0 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .movie-poster img {
            width: 100%;
            height: auto;
            display: block;
        }

        .movie-info {
            flex: 1;
        }

        .movie-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--light-gray);
            font-size: 14px;
        }

        .meta-item i {
            color: var(--primary);
        }

        .movie-description {
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--light-gray);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            main {
                padding: 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .filters {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .movie-details {
                flex-direction: column;
            }

            .movie-poster {
                flex: none;
                max-width: 300px;
                margin: 0 auto;
            }
        }

        @media (max-width: 576px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .card-img {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../imagem/logo.png" alt="Cine Up" style="width: 200px; height: 80px;">
        </div>

        <div class="user-info">
            <span class="user-welcome">Olá, <strong>{{ usuario_nome }}</strong>! 👋</span>
            <a href="/logout" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> Sair
            </a>
        </div>

    </header>

    <!-- Mensagens -->
    {% if request.args.get('success') %}
    <div class="alert alert-success">
        <i class="fas fa-check-circle"></i> {{ request.args.get('success') }}
    </div>
    {% endif %}

    {% if request.args.get('error') %}
    <div class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i> {{ request.args.get('error') }}
    </div>
    {% endif %}

    <main>
        <div class="page-header">
            <h2 class="page-title">
                <i class="fas fa-film"></i> Catálogo de Filmes
            </h2>
            {% if is_admin %}
            <div style="display: flex; gap: 15px;">
                <button class="btn btn-primary" onclick="openAddMovieModal()">
                    <i class="fas fa-plus"></i> Gerenciar Filme
                </button>
                <button class="btn btn-primary" onclick="gerenciarUsuarios()">
                    <i class="fas fa-users-cog"></i> Gerenciar Usuários
                </button>
            </div>
            {% endif %}
        </div>

        <div class="filters">
            <select class="filter-select" id="genreFilter">
                <option value="">Todos os Gêneros</option>
                <option value="acao">Ação</option>
                <option value="aventura">Aventura</option>
                <option value="comedia">Comédia</option>
                <option value="drama">Drama</option>
                <option value="ficcao">Ficção Científica</option>
                <option value="fantasia">Fantasia</option>
                <option value="suspense">Suspense</option>
            </select>

            <select class="filter-select" id="yearFilter">
                <option value="">Todos os Anos</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
            </select>

            <select class="filter-select" id="ratingFilter">
                <option value="">Todas as Avaliações</option>
                <option value="5">5 Estrelas</option>
                <option value="4">4+ Estrelas</option>
                <option value="3">3+ Estrelas</option>
            </select>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar filmes...">
            </div>
        </div>

        <div class="grid" id="moviesGrid">
            <!-- Os cards de filmes serão gerados dinamicamente via JavaScript -->
        </div>
    </main>

    <!-- Modal de Detalhes do Filme -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalMovieTitle">Detalhes do Filme</h3>
                <button class="close-btn" onclick="closeMovieModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalMovieContent">
                <!-- Conteúdo será preenchido via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // 🔥 JAVASCRIPT MANTIDO EXATAMENTE IGUAL - 100% FUNCIONAL
        // Variável global para armazenar filmes e avaliações
        let movies = [];
        let userReviews = [];

        // Função para carregar filmes do banco
        async function loadMovies() {
            try {
                console.log('🎬 Carregando filmes do banco...');

                // Carregar filmes reais do banco
                const response = await fetch('/api/filmes-completos');
                if (response.ok) {
                    movies = await response.json();
                    console.log('✅ Filmes carregados do banco:', movies);
                } else {
                    console.error('❌ Erro ao carregar filmes do banco');
                    movies = [];
                }
            } catch (error) {
                console.error('❌ Erro ao carregar filmes:', error);
                movies = [];
            }
        }

        // Função para carregar avaliações do usuário
        async function loadUserReviews() {
            try {
                const response = await fetch('/api/minhas-avaliacoes');
                if (response.ok) {
                    userReviews = await response.json();
                    console.log('📝 Avaliações carregadas:', userReviews);
                }
            } catch (error) {
                console.error('Erro ao carregar avaliações:', error);
            }
        }

        // Função para obter avaliação de um filme específico
        function getUserReview(movieId) {
            return userReviews.find(review => review.filme_id === movieId);
        }

        // Função para renderizar os filmes
        function renderMovies() {
            const moviesGrid = document.getElementById('moviesGrid');

            if (movies.length === 0) {
                moviesGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--light-gray);">
                        <i class="fas fa-film" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                        <h3>Nenhum filme disponível</h3>
                        <p>Os filmes serão exibidos aqui quando forem adicionados ao catálogo.</p>
                    </div>
                `;
                return;
            }

            moviesGrid.innerHTML = '';

            movies.forEach(movie => {
                const userReview = getUserReview(movie.id);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-badge">${movie.year}</div>
                    <img src="${movie.image}" alt="${movie.title}" class="card-img"
                         onerror="this.src='https://via.placeholder.com/300x450/2a2a2a/ffffff?text=Imagem+Não+Disponível'">
                    <div class="card-content">
                        <h3 class="card-title">${movie.title}</h3>
                        <div class="card-meta">
                            <span class="card-genre">${movie.genre}</span>
                            <div class="card-rating">
                                <i class="fas fa-star"></i>
                                <span>${movie.rating}</span>
                            </div>
                        </div>
                        <p class="card-description">${movie.description}</p>
                        <div class="card-actions">
                            <a href="${movie.streaming}" class="card-btn watch-btn" target="_blank">
                                <i class="fas fa-play"></i> Assistir
                            </a>
                            <button class="card-btn details-btn" onclick="openMovieModal(${movie.id})">
                                <i class="fas fa-info-circle"></i> Detalhes
                            </button>
                        </div>

                        <!-- Sistema de Avaliação -->
                        <div class="rating-section">
                            <h4 class="rating-title">${userReview ? 'Sua Avaliação:' : 'Avalie este filme:'}</h4>
                            <form method="POST" action="/avaliar/${movie.id}">
                                <div class="stars" data-filme="${movie.id}">
                                    ${Array.from({length: 5}, (_, i) =>
                                        `<span class="star" data-rating="${i + 1}">★</span>`
                                    ).join('')}
                                </div>
                                <input type="hidden" name="nota" id="nota-${movie.id}" value="${userReview ? userReview.nota : '0'}" required>
                                <textarea name="comentario" class="comment-box"
                                         placeholder="${userReview ? 'Atualize seu comentário...' : 'Seu comentário (opcional)'}" rows="2">${userReview ? userReview.comentario || '' : ''}</textarea>
                                <button type="submit" class="submit-btn">
                                    <i class="fas fa-star"></i> ${userReview ? 'Atualizar Avaliação' : 'Avaliar'}
                                </button>
                            </form>

                            ${userReview ? `
                                <div class="saved-review">
                                    <div class="review-header">
                                        <div class="review-stars">
                                            ${'★'.repeat(userReview.nota)}${'☆'.repeat(5 - userReview.nota)}
                                        </div>
                                        <div class="review-date">
                                            ${userReview.data ? new Date(userReview.data).toLocaleDateString('pt-BR') : 'Avaliado'}
                                        </div>
                                    </div>
                                    ${userReview.comentario ? `
                                        <div class="review-comment">
                                            "${userReview.comentario}"
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });

            // Inicializar sistema de estrelas
            initializeStarRating();
        }

        // Sistema de avaliação com estrelas
        function initializeStarRating() {
            document.querySelectorAll('.stars').forEach(starsContainer => {
                const stars = starsContainer.querySelectorAll('.star');
                const hiddenInput = document.getElementById(`nota-${starsContainer.dataset.filme}`);
                const userReview = getUserReview(parseInt(starsContainer.dataset.filme));

                // Se já existe avaliação, preencher as estrelas
                if (userReview) {
                    stars.forEach((star, index) => {
                        if (index < userReview.nota) {
                            star.classList.add('active');
                        }
                    });
                }

                stars.forEach(star => {
                    star.addEventListener('click', () => {
                        const rating = parseInt(star.dataset.rating);
                        hiddenInput.value = rating;

                        // Atualizar visual das estrelas
                        stars.forEach((s, index) => {
                            if (index < rating) {
                                s.classList.add('active');
                            } else {
                                s.classList.remove('active');
                            }
                        });
                    });
                });
            });
        }

        // Função para abrir modal de detalhes do filme
        function openMovieModal(movieId) {
            const movie = movies.find(m => m.id === movieId);
            if (!movie) return;

            document.getElementById('modalMovieTitle').textContent = movie.title;

            const modalContent = document.getElementById('modalMovieContent');
            modalContent.innerHTML = `
                <div class="movie-details">
                    <div class="movie-poster">
                        <img src="${movie.image}" alt="${movie.title}"
                             onerror="this.src='https://via.placeholder.com/300x450/2a2a2a/ffffff?text=Imagem+Não+Disponível'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-meta">
                            <div class="meta-item">
                                <i class="fas fa-calendar-alt"></i>
                                <span>${movie.year}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-clock"></i>
                                <span>${movie.duration}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-film"></i>
                                <span>${movie.genre}</span>
                            </div>
                        </div>
                        <div class="movie-description">
                            <p>${movie.description}</p>
                        </div>
                        <div class="movie-meta">
                            <div class="meta-item">
                                <i class="fas fa-user"></i>
                                <span><strong>Diretor:</strong> ${movie.director}</span>
                            </div>
                        </div>
                        <div class="movie-meta">
                            <div class="meta-item">
                                <i class="fas fa-users"></i>
                                <span><strong>Elenco:</strong> ${movie.cast}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('movieModal').style.display = 'flex';
        }

        // Função para fechar o modal
        function closeMovieModal() {
            document.getElementById('movieModal').style.display = 'none';
        }

        // Função para abrir modal de adicionar filme
        function openAddMovieModal() {
            window.location.href = '/filmes';
        }

        // Filtros e busca
        function setupFilters() {
            const genreFilter = document.getElementById('genreFilter');
            const yearFilter = document.getElementById('yearFilter');
            const ratingFilter = document.getElementById('ratingFilter');
            const searchInput = document.getElementById('searchInput');

            [genreFilter, yearFilter, ratingFilter, searchInput].forEach(element => {
                element.addEventListener('change', filterMovies);
                element.addEventListener('input', filterMovies);
            });
        }

        function filterMovies() {
            const genreValue = document.getElementById('genreFilter').value.toLowerCase();
            const yearValue = document.getElementById('yearFilter').value;
            const searchValue = document.getElementById('searchInput').value.toLowerCase();

            const filteredMovies = movies.filter(movie => {
                const matchGenre = !genreValue || movie.genre.toLowerCase().includes(genreValue);
                const matchYear = !yearValue || movie.year.toString() === yearValue;
                const matchSearch = !searchValue ||
                                   movie.title.toLowerCase().includes(searchValue) ||
                                   movie.genre.toLowerCase().includes(searchValue);

                return matchGenre && matchYear && matchSearch;
            });

            // Renderizar filmes filtrados
            renderFilteredMovies(filteredMovies);
        }

        function renderFilteredMovies(filteredMovies) {
            const moviesGrid = document.getElementById('moviesGrid');

            if (filteredMovies.length === 0) {
                moviesGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--light-gray);">
                        <i class="fas fa-search" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                        <h3>Nenhum filme encontrado</h3>
                        <p>Tente ajustar os filtros ou termos de busca.</p>
                    </div>
                `;
                return;
            }

            moviesGrid.innerHTML = '';
            filteredMovies.forEach(movie => {
                const userReview = getUserReview(movie.id);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-badge">${movie.year}</div>
                    <img src="${movie.image}" alt="${movie.title}" class="card-img"
                         onerror="this.src='https://via.placeholder.com/300x450/2a2a2a/ffffff?text=Imagem+Não+Disponível'">
                    <div class="card-content">
                        <h3 class="card-title">${movie.title}</h3>
                        <div class="card-meta">
                            <span class="card-genre">${movie.genre}</span>
                            <div class="card-rating">
                                <i class="fas fa-star"></i>
                                <span>${movie.rating}</span>
                            </div>
                        </div>
                        <p class="card-description">${movie.description}</p>
                        <div class="card-actions">
                            <a href="${movie.streaming}" class="card-btn watch-btn" target="_blank">
                                <i class="fas fa-play"></i> Assistir
                            </a>
                            <button class="card-btn details-btn" onclick="openMovieModal(${movie.id})">
                                <i class="fas fa-info-circle"></i> Detalhes
                            </button>
                        </div>

                        <!-- Sistema de Avaliação -->
                        <div class="rating-section">
                            <h4 class="rating-title">${userReview ? 'Sua Avaliação:' : 'Avalie este filme:'}</h4>
                            <form method="POST" action="/avaliar/${movie.id}">
                                <div class="stars" data-filme="${movie.id}">
                                    ${Array.from({length: 5}, (_, i) =>
                                        `<span class="star" data-rating="${i + 1}">★</span>`
                                    ).join('')}
                                </div>
                                <input type="hidden" name="nota" id="nota-${movie.id}" value="${userReview ? userReview.nota : '0'}" required>
                                <textarea name="comentario" class="comment-box"
                                         placeholder="${userReview ? 'Atualize seu comentário...' : 'Seu comentário (opcional)'}" rows="2">${userReview ? userReview.comentario || '' : ''}</textarea>
                                <button type="submit" class="submit-btn">
                                    <i class="fas fa-star"></i> ${userReview ? 'Atualizar Avaliação' : 'Avaliar'}
                                </button>
                            </form>

                            ${userReview ? `
                                <div class="saved-review">
                                    <div class="review-header">
                                        <div class="review-stars">
                                            ${'★'.repeat(userReview.nota)}${'☆'.repeat(5 - userReview.nota)}
                                        </div>
                                        <div class="review-date">
                                            ${userReview.data ? new Date(userReview.data).toLocaleDateString('pt-BR') : 'Avaliado'}
                                        </div>
                                    </div>
                                    ${userReview.comentario ? `
                                        <div class="review-comment">
                                            "${userReview.comentario}"
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });

            initializeStarRating();
        }

        // Função para gerenciar usuários
        function gerenciarUsuarios() {
            window.location.href = '/usuarios';
        }

        // Inicializar a página
        document.addEventListener('DOMContentLoaded', async function() {
            await loadMovies(); // Carregar filmes primeiro
            await loadUserReviews(); // Depois carregar avaliações
            renderMovies();
            setupFilters();

            // Fechar modal ao clicar fora dele
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('movieModal');
                if (event.target === modal) {
                    closeMovieModal();
                }
            });
        });
    </script>
</body>
</html>
