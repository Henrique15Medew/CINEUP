<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CINEUP — Cadastro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0a84ff;
      --primary-dark: #0066cc;
      --primary-light: #4da8ff;
      --dark: #0a0a0a;
      --darker: #050505;
      --dark-gray: #1a1a1a;
      --medium-gray: #2a2a2a;
      --light-gray: #6c757d;
      --light: #ffffff;
      --accent: #00d4ff;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #e50914;
      --admin: #ff6b00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .register-card {
      background: linear-gradient(145deg, var(--dark-gray), var(--medium-gray));
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .register-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }

    .top-navigation {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      background: var(--dark);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--medium-gray);
    }

    .nav-btn {
      padding: 6px 12px;
      background: transparent;
      color: var(--light-gray);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 13px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      font-size: 48px;
      margin-bottom: 10px;
      display: block;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--light-gray);
      font-size: 16px;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--light);
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-gray);
    }

    input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      border-radius: 8px;
      background: var(--dark);
      border: 1px solid var(--medium-gray);
      color: var(--light);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.2);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--light-gray);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(10, 132, 255, 0.4);
    }

    .login-link {
      text-align: center;
      color: var(--light-gray);
      font-size: 14px;
      margin-top: 25px;
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .login-link a:hover {
      color: var(--primary-light);
    }

    /* Efeito de partículas no fundo */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(10, 132, 255, 0.15);
      border-radius: 50%;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    /* Responsividade */
    @media (max-width: 480px) {
      .register-card {
        padding: 30px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <main class="register-container">
    <div class="register-card">
      <!-- BOTÕES SUPERIORES -->
      <div class="top-navigation">
        <div class="header-buttons">
          <a href="/" class="nav-btn">Home</a>
          <a href="/login" class="nav-btn">Login</a>
          <a href="/register" class="nav-btn active">Register</a>
        </div>
      </div>

      <div class="logo">
        <span class="logo-icon">🎬</span>
        <h1>CINEUP</h1>
        <p class="subtitle">Crie sua conta para acessar o catálogo</p>
      </div>

      <form method="POST" action="/register">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <div class="input-with-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-with-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required />
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
            <button type="button" class="password-toggle" id="password-toggle">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fas fa-user-plus"></i> Criar Conta
        </button>
      </form>

      <p class="login-link">
        Já tem uma conta? <a href="/login">Faça login</a>
      </p>
    </div>
  </main>

  <script>
    // Criar partículas animadas no fundo
    document.addEventListener('DOMContentLoaded', function() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 15;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');

        const size = Math.random() * 20 + 5;
        const left = Math.random() * 100;
        const delay = Math.random() * 15;

        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${left}%`;
        particle.style.animationDelay = `${delay}s`;

        particlesContainer.appendChild(particle);
      }

      // Alternar visibilidade da senha
      const passwordToggle = document.getElementById('password-toggle');
      const passwordInput = document.getElementById('senha');

      passwordToggle.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        const icon = passwordToggle.querySelector('i');
        icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
      });
    });
  </script>
</body>
</html>
