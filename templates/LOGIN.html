<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CINEUP — Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0a84ff;
      --primary-dark: #0066cc;
      --primary-light: #4da8ff;
      --dark: #0a0a0a;
      --darker: #050505;
      --dark-gray: #1a1a1a;
      --medium-gray: #2a2a2a;
      --light-gray: #6c757d;
      --light: #ffffff;
      --accent: #00d4ff;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #e50914;
      --admin: #ff6b00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .login-card {
      background: linear-gradient(145deg, var(--dark-gray), var(--medium-gray));
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }

    .top-navigation {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      background: var(--dark);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--medium-gray);
    }

    .nav-btn {
      padding: 6px 12px;
      background: transparent;
      color: var(--light-gray);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 13px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .login-type-toggle {
      display: flex;
      background: var(--dark);
      border-radius: 10px;
      padding: 5px;
      margin-bottom: 25px;
      border: 1px solid var(--medium-gray);
    }

    .toggle-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--light-gray);
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .admin-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255, 107, 0, 0.1);
      border: 1px solid var(--admin);
      border-radius: 8px;
      color: var(--admin);
      font-size: 14px;
      font-weight: 600;
    }

    .admin-indicator i {
      color: var(--admin);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      font-size: 48px;
      margin-bottom: 10px;
      display: block;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--light-gray);
      font-size: 16px;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--light);
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-gray);
    }

    input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      border-radius: 8px;
      background: var(--dark);
      border: 1px solid var(--medium-gray);
      color: var(--light);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.2);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--light-gray);
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      width: auto;
    }

    .forgot {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot:hover {
      color: var(--primary-light);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(10, 132, 255, 0.4);
    }

    .btn-admin {
      background: linear-gradient(135deg, var(--admin), #ff8c00);
      color: white;
    }

    .btn-admin:hover {
      background: linear-gradient(135deg, #ff8c00, var(--admin));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: var(--light-gray);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--medium-gray);
    }

    .divider span {
      padding: 0 15px;
      font-size: 14px;
    }

    .social-login {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--medium-gray);
      background: var(--dark);
      color: var(--light);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .social-btn:hover {
      background: var(--dark-gray);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .social-btn.google {
      border-color: #DB4437;
    }

    .social-btn.google:hover {
      background: rgba(219, 68, 55, 0.1);
    }

    .social-btn.facebook {
      border-color: #4267B2;
    }

    .social-btn.facebook:hover {
      background: rgba(66, 103, 178, 0.1);
    }

    .register-link {
      text-align: center;
      color: var(--light-gray);
      font-size: 14px;
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .register-link a:hover {
      color: var(--primary-light);
    }

    .admin-credentials {
      background: rgba(255, 107, 0, 0.05);
      border: 1px solid rgba(255, 107, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-size: 12px;
    }

    .admin-credentials h4 {
      color: var(--admin);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-credentials p {
      color: var(--light-gray);
      margin-bottom: 5px;
    }

    /* Efeito de partículas no fundo */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(10, 132, 255, 0.15);
      border-radius: 50%;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    /* Responsividade */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 25px;
      }

      .social-login {
        flex-direction: column;
      }

      .options {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <main class="login-container">
    <div class="login-card">
      <!-- BOTÕES SUPERIORES ADICIONADOS AQUI -->
      <div class="top-navigation">
        <div class="header-buttons">
          <a href="/" class="nav-btn">Home</a>
          <a href="/login" class="nav-btn active">Login</a>
          <a href="/register" class="nav-btn">Register</a>
        </div>
      </div>

      <div class="logo">
        <span class="logo-icon">🎬</span>
        <h1>CINEUP</h1>
        <p class="subtitle" id="login-subtitle">Entre em sua conta para acessar o painel</p>
      </div>

      <div class="login-type-toggle">
        <button class="toggle-btn active" id="user-toggle">Usuário</button>
        <button class="toggle-btn" id="admin-toggle">Administrador</button>
      </div>

      <div class="admin-indicator" id="admin-indicator" style="display: none;">
        <i class="fas fa-shield-alt"></i>
        <span>Acesso Administrativo</span>
      </div>

<form method="POST" action="/login">
    <div class="form-group">
        <label for="login-email" id="email-label">Email</label>
        <div class="input-with-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="login-email" name="email" placeholder="Digite seu email" required />
        </div>
    </div>

    <div class="form-group">
        <label for="login-password">Senha</label>
        <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="login-password" name="senha" placeholder="Digite sua senha" required />
            <button type="button" class="password-toggle" id="password-toggle">
                <i class="fas fa-eye"></i>
            </button>
        </div>
    </div>

    <div class="options">
        <div class="remember">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Lembrar de mim</label>
        </div>
        <a href="#" class="forgot">Esqueceu a senha?</a>
    </div>

    <button type="submit" class="btn btn-primary" id="login-button">
        <i class="fas fa-sign-in-alt"></i> Entrar
    </button>
</form>

      <div class="admin-credentials" id="admin-credentials" style="display: none;">
        <h4><i class="fas fa-key"></i> Credenciais do Admin</h4>
        <p><strong>Email:</strong> admin@cineup.com</p>
        <p><strong>Senha:</strong> admin123</p>
      </div>

      <div class="divider">
        <span>ou entre com</span>
      </div>

      <div class="social-login">
        <button class="social-btn google" id="google-login">
          <i class="fab fa-google"></i> Google
        </button>
        <button class="social-btn facebook" id="facebook-login">
          <i class="fab fa-facebook-f"></i> Facebook
        </button>
      </div>

      <p class="register-link">
        Ainda não tem conta? <a href="/register">Cadastre-se</a>
      </p>
    </div>
  </main>

  <script>
    // Credenciais do Admin pré-definidas
    const ADMIN_CREDENTIALS = {
      email: "admin@cineup.com",
      password: "admin123"
    };

    // Criar partículas animadas no fundo
    document.addEventListener('DOMContentLoaded', function() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 15;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');

        const size = Math.random() * 20 + 5;
        const left = Math.random() * 100;
        const delay = Math.random() * 15;

        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${left}%`;
        particle.style.animationDelay = `${delay}s`;

        particlesContainer.appendChild(particle);
      }

      // Elementos do DOM
      const userToggle = document.getElementById('user-toggle');
      const adminToggle = document.getElementById('admin-toggle');
      const adminIndicator = document.getElementById('admin-indicator');
      const adminCredentials = document.getElementById('admin-credentials');
      const loginSubtitle = document.getElementById('login-subtitle');
      const emailLabel = document.getElementById('email-label');
      const loginButton = document.getElementById('login-button');
      const loginEmail = document.getElementById('login-email');

      // Alternar entre usuário e admin
      userToggle.addEventListener('click', function() {
        userToggle.classList.add('active');
        adminToggle.classList.remove('active');
        adminIndicator.style.display = 'none';
        adminCredentials.style.display = 'none';
        loginSubtitle.textContent = 'Entre em sua conta para acessar o painel';
        emailLabel.textContent = 'Email';
        loginButton.className = 'btn btn-primary';
        loginButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
        loginEmail.placeholder = 'Digite seu email';
      });

      adminToggle.addEventListener('click', function() {
        adminToggle.classList.add('active');
        userToggle.classList.remove('active');
        adminIndicator.style.display = 'flex';
        adminCredentials.style.display = 'block';
        loginSubtitle.textContent = 'Acesso administrativo do sistema';
        emailLabel.textContent = 'Email do Admin';
        loginButton.className = 'btn btn-admin';
        loginButton.innerHTML = '<i class="fas fa-shield-alt"></i> Entrar como Admin';
        loginEmail.placeholder = 'Digite o email do admin';
      });

      // Alternar visibilidade da senha
      const passwordToggle = document.getElementById('password-toggle');
      const passwordInput = document.getElementById('login-password');

      passwordToggle.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        const icon = passwordToggle.querySelector('i');
        icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
      });

      // Login com Google (simulação)
      document.getElementById('google-login').addEventListener('click', function() {
        alert('Login com Google selecionado.');
      });

      // Login com Facebook (simulação)
      document.getElementById('facebook-login').addEventListener('click', function() {
        alert('Login com Facebook selecionado.');
      });

      // Processar formulário de login
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim();
          const senha = document.getElementById('login-password').value.trim();
          const isAdminMode = adminToggle.classList.contains('active');

          if (isAdminMode) {
            // Login como Admin
            if (email === ADMIN_CREDENTIALS.email && senha === ADMIN_CREDENTIALS.password) {
              const adminUser = {
                email: email,
                nome: "Administrador",
                tipo: "admin",
                isAdmin: true
              };

              localStorage.setItem("cineup_logado", JSON.stringify(adminUser));
              localStorage.setItem("cineup_is_admin", "true");

              // Efeito visual de sucesso
              const submitBtn = form.querySelector('button[type="submit"]');
              const originalText = submitBtn.innerHTML;
              submitBtn.innerHTML = '<i class="fas fa-check"></i> Admin autenticado!';
              submitBtn.style.background = 'linear-gradient(135deg, var(--admin), #ff8c00)';

              setTimeout(() => {
                window.location.href = "/";
              }, 1000);
            } else {
              alert("Credenciais de administrador incorretas!");
              form.classList.add('shake');
              setTimeout(() => form.classList.remove('shake'), 500);
            }
          } else {
            // Login como Usuário Normal
            const usuarios = JSON.parse(localStorage.getItem("cineup_usuarios") || "[]");
            const user = usuarios.find(u => u.email === email && u.senha === senha);

            if (user) {
              user.tipo = "usuario";
              user.isAdmin = false;

              localStorage.setItem("cineup_logado", JSON.stringify(user));
              localStorage.setItem("cineup_is_admin", "false");

              // Efeito visual de sucesso
              const submitBtn = form.querySelector('button[type="submit"]');
              const originalText = submitBtn.innerHTML;
              submitBtn.innerHTML = '<i class="fas fa-check"></i> Login bem-sucedido!';
              submitBtn.style.background = 'linear-gradient(135deg, var(--success), #1e7e34)';

              setTimeout(() => {
                window.location.href = "/";
              }, 1000);
            } else {
              alert("Email ou senha incorretos");
              form.classList.add('shake');
              setTimeout(() => form.classList.remove('shake'), 500);
            }
          }
        });
      }

      // Adicionar estilo para animação de shake
      const style = document.createElement('style');
      style.textContent = `
        .shake {
          animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }
      `;
      document.head.appendChild(style);
    });

    // Função para verificar se o usuário é admin (usar em outras páginas)
    function isUserAdmin() {
      const userData = localStorage.getItem("cineup_logado");
      if (!userData) return false;

      const user = JSON.parse(userData);
      return user.isAdmin === true || user.tipo === "admin";
    }

    // Função para proteger páginas admin (usar em páginas administrativas)
    function protectAdminPage() {
      if (!isUserAdmin()) {
        alert("Acesso negado! Esta área é restrita a administradores.");
        window.location.href = "/login";
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
